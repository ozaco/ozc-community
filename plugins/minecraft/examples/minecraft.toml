# Two Minecraft servers on the cluster `[kube].profile` names (`-p` picks another). This file is an
# ozaco config fragment: put it beside `.ozaco/kube.toml` as `.ozaco/minecraft.toml`, or paste the
# tables into `ozaco.toml` — the plugin discovers it from the directory it runs in (or `-C`) up to
# the home directory. Every value here but `type` has a default; a table with nothing in it is a
# server too.
#
#   ozc minecraft preview            # the objects, no cluster needed
#   ozc minecraft up                 # both servers    ·   ozc minecraft up survival
#   ozc minecraft status             # ready, address, players — and the DNS records a domain needs
#   ozc minecraft logs survival -f   ·   ozc minecraft console survival say hello
#   ozc minecraft backup survival    # a Longhorn snapshot of the world (--s3: to the backup target)
#   ozc minecraft restore survival   # down first; then up
#
# Several servers are several tables, each with a port of its own on the node: two servers on one
# port are refused before the cluster is asked.

# ── survival: Paper, plugins, a domain ─────────────────────────────────────────────────────────
[minecraft.survival]
namespace = "games"
type = "PAPER" # VANILLA, FABRIC, FORGE, NEOFORGE, PURPUR, … as the image spells it
version = "1.21.1" # LATEST by default
domain = "play.example.com" # players connect by this name: see `status` for the A (and SRV) record
port = 25565 # the port on the node's address (expose = "loadbalancer", the default)
memory = "2G" # the Java heap, written as Java reads it — also the pod's memory request
memoryLimit = "3Gi" # the pod's limits, written as Kubernetes reads them; cpu = "500m", cpuLimit = "2"
storage = "20Gi" # the world's volume (10Gi by default); storageClass = "longhorn"
backup = "s3" # `backup` pushes to the backup target by default; "snapshot" (default) stays in-cluster
motd = "ozaco survival"
difficulty = "normal" # peaceful, easy, normal, hard
maxPlayers = 20
onlineMode = true
ops = ["steve"]
whitelist = ["steve", "alex"] # naming anyone turns the whitelist on
timezone = "Europe/Istanbul"
spiget = [9089, 1997] # Spigot resources by id (EssentialsX, LuckPerms), installed at start
plugins = [ # plugins by jar URL, likewise
  "https://example.com/plugins/MyPlugin-1.0.jar",
]

jvmOpts = ["-XX:+UseZGC"] # extra JVM arguments (JVM_OPTS); aikarFlags = true adds Aikar's GC flags
aikarFlags = true

[minecraft.survival.env] # anything else the image reads, laid over the fields above
ENABLE_COMMAND_BLOCK = true

[minecraft.survival.properties] # server.properties, any key as the file spells it; wins over the fields above
view-distance = 12
simulation-distance = 8
pvp = true
level-seed = "ozaco"
spawn-protection = 0

# The server's own files, nested as each file is: every leaf is put into the file at start, the
# rest of the file is left as it is. `paper` is config/paper-global.yml, `paperWorld`
# config/paper-world-defaults.yml, `bukkit` bukkit.yml, `spigot` spigot.yml; `files` is any other
# YAML, JSON, TOML or properties file under /data, by path.
[minecraft.survival.paper.anticheat.anti-xray]
enabled = true
engine-mode = 2

[minecraft.survival.paper.chunks]
auto-save-interval = 12000

[minecraft.survival.paperWorld.entities.spawning]
per-player-mob-spawns = true

[minecraft.survival.bukkit.spawn-limits]
monsters = 50

[minecraft.survival.spigot.settings]
bungeecord = false

[minecraft.survival.files."plugins/Essentials/config.yml"]
auto-afk = 300
player-commands = ["afk", "balance"]

# ── creative: Fabric with Modrinth mods, offline, behind Discord and a password ────────────────
# Offline (`onlineMode = false`) a name proves nothing: anyone can join as anyone — an operator
# too. `discord` lets in only names linked to a Discord account; `auth` asks a password of each.
# Both are mods (Fabric, Quilt, NeoForge; `discord` Forge too) and both are needed: the link is by
# name, and while the bot is not up the door is open. Every server, whatever it is, runs as the
# image's own user, takes the game port only, and sees each player's own address.
[minecraft.creative]
namespace = "games"
type = "FABRIC"
version = "1.21.1"
port = 25566 # a second server, a second port on the same node
memory = "4G"
cpu = "1"
cpuLimit = "3"
memoryLimit = "6Gi"
maxPlayers = 50 # as many as the heap and the cpu carry: view-distance is what each one costs
onlineMode = false
ops = ["steve"] # offline names are marked so: the image writes the UUID an offline server sees
whitelist = ["steve", "alex"] # the whole list — a name taken out loses its place at the next start
modrinth = ["fabric-api", "lithium", "sodium:mc1.21.1-0.6.0"] # slug, or slug:version
modrinthDependencies = "required"
removeOldMods = true # mods no longer listed are dropped at the next start

# Simple Discord Link (`sdlink`, installed with what it needs): a name not linked yet is turned
# away with a code to `/verify` with the bot. The bot: discord.com/developers → New Application →
# Bot → token, with the Server Members and Message Content intents on; invited to your Discord.
# The token lives in a Secret of the namespace, never here:
#   ozc secret set minecraft-discord -n games -d token=@discord-token.txt
[minecraft.creative.discord]
secret = "minecraft-discord" # the Secret, and its key (`key = "token"` by default)
channel = "1234567890123456789" # the channel the bot talks in, by ID (Copy Channel ID) — the mod needs one
roles = ["player"] # one of these Discord roles to get in (none: any linked account) — by name or ID
deniedRoles = ["banned"]
member = true # only members of the bot's Discord server (the default)
banSync = true # banned on Discord → banned in the game

# EasyAuth (`easyauth`): the first to join under a name `/register`s it, every next join
# `/login`s — or none, coming back from the same address within `session`.
[minecraft.creative.auth]
session = 86400 # seconds; 0 asks at every join
passwordLength = 8
loginTries = 3
kickAfter = 60 # seconds to log in
accountsPerIp = 3 # names one address may hold

# Whole files under config/, written at every start — so before a mod made its own, and in the
# format the mod reads (HOCON `.conf` too). What a table leaves out is the mod's default; one for
# a file `discord` or `auth` writes is laid over theirs.
[minecraft.creative.configs."config/EasyAuth/main.conf"]
hidePlayerCoords = true # a player is somewhere else until logged in

[minecraft.creative.configs."config/lithium.properties"]
mixin.ai.pathing = false

# Variables from a Secret, never written here; one named CFG_… is `${CFG_…}` in any file above.
[minecraft.creative.secretEnv]
CFG_WEBHOOK = { secret = "minecraft-discord", key = "webhook" }
